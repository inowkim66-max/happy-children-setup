
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Children | 기기 설정</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #edf4ff;
  color: #142749;
  font: 16px/1.6 system-ui, "Malgun Gothic", sans-serif;
}

main {
  width: min(680px, calc(100% - 32px));
  margin: 32px auto;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.logo {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: #2159d5;
  color: white;
  font-weight: 800;
}

header button { margin-left: auto; }

section, dialog {
  background: white;
  border: 1px solid #dce6f7;
  border-radius: 22px;
  padding: clamp(20px, 5vw, 36px);
}

h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 34px);
  line-height: 1.3;
}

p { color: #4a5e7d; }

button, .download {
  display: inline-block;
  padding: 12px 16px;
  border: 1px solid #c9d9f4;
  border-radius: 12px;
  background: #f4f8ff;
  color: #17449e;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

.primary {
  background: #2159d5;
  border-color: #2159d5;
  color: white;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

#status {
  min-height: 3em;
  margin-bottom: 0;
  overflow-wrap: anywhere;
}

dialog {
  width: min(480px, calc(100% - 32px));
  color: inherit;
}

dialog::backdrop { background: #14274988; }

label {
  display: block;
  margin-bottom: 16px;
  font-weight: 700;
}

input {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  border: 1px solid #c9d9f4;
  border-radius: 10px;
  font: inherit;
}

[hidden] { display: none !important; }

.note {
  padding: 12px;
  background: #f4f8ff;
  border-radius: 12px;
  font-size: 13px;
}
</style>
</head>

<body>

<main>
  <header>
    <span class="logo">HC</span>
    <strong>Happy Children</strong>
    <button id="open-admin" type="button">관리자</button>
  </header>

  <section>
    <h1>아이의 갤럭시 연결하기</h1>

    <p>
      PC에서 Chrome 또는 Edge로 이 페이지를 열어 주세요.
      갤럭시에서 USB 디버깅을 켜고 데이터 전송이 가능한
      USB 케이블로 연결하세요.
    </p>

    <div class="actions">
      <button id="connect" class="primary" type="button">
        갤럭시 연결 및 상태 확인
      </button>

      <a id="download" class="download"
         href="https://sxwfodmfqiykxhoqyrkv.supabase.co/storage/v1/object/public/happy-children-apk/Happy%20Children%20v1.0.apk">
        APK 다운로드
      </a>
    </div>

    <div class="actions" style="margin-top:12px">
      <button id="register" class="primary" type="button" hidden>
        이탈 방지 설정
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      갤럭시를 USB로 연결한 후 버튼을 눌러 주세요.
    </p>

    <p class="note">
      USB 디버깅 허용 창이 나타나면 휴대폰에서 허용을 선택하세요.
      기기 관리자 등록은 별도 확인 후 진행됩니다.
    </p>
  </section>
</main>

<dialog id="admin">
  <h2 id="admin-title">관리자 설정</h2>
  <p>APK 주소 변경은 이 브라우저에만 저장됩니다.</p>

  <form id="unlock">
    <label>설정 PIN
      <input id="pin" type="password"
             inputmode="numeric" required>
    </label>
    <button class="primary" type="submit">열기</button>
  </form>

  <form id="settings" hidden>
    <label>Supabase 공개 APK 주소
      <input id="apk-url" type="url" required>
    </label>
    <button class="primary" type="submit">저장</button>
  </form>

  <p id="admin-status" role="status"></p>
  <form method="dialog">
    <button>닫기</button>
  </form>
</dialog>

<script>
const download = document.querySelector("#download");
const admin = document.querySelector("#admin");
const unlock = document.querySelector("#unlock");
const settings = document.querySelector("#settings");
const pin = document.querySelector("#pin");
const apkUrl = document.querySelector("#apk-url");
const adminStatus = document.querySelector("#admin-status");

const storageKey = "happy-children.public-apk";
const supabaseOrigin = new URL(download.href).origin;

function publicApkUrl(value) {
  const url = new URL(value);

  if (
    url.origin !== supabaseOrigin ||
    !url.pathname.startsWith("/storage/v1/object/public/") ||
    !url.pathname.toLowerCase().endsWith(".apk")
  ) {
    throw new Error("이 Supabase 프로젝트의 공개 APK 주소를 입력해 주세요.");
  }

  return url.href;
}

try {
  const savedUrl = localStorage.getItem(storageKey);
  if (savedUrl) download.href = publicApkUrl(savedUrl);
} catch {}

document.querySelector("#open-admin").addEventListener("click", () => {
  pin.value = "";
  unlock.hidden = false;
  settings.hidden = true;
  adminStatus.textContent = "";
  admin.showModal();
});

unlock.addEventListener("submit", event => {
  event.preventDefault();

  if (pin.value !== "0000") {
    adminStatus.textContent = "PIN을 다시 확인해 주세요.";
    return;
  }

  unlock.hidden = true;
  settings.hidden = false;
  apkUrl.value = download.href;
  adminStatus.textContent = "";
  apkUrl.focus();
});

settings.addEventListener("submit", event => {
  event.preventDefault();

  try {
    const url = publicApkUrl(apkUrl.value.trim());
    localStorage.setItem(storageKey, url);
    download.href = url;
    adminStatus.textContent = "이 브라우저에 저장했습니다.";
  } catch (error) {
    adminStatus.textContent = error.message;
  }
});
</script>

<script type="module">

const connect = document.querySelector("#connect");
const register = document.querySelector("#register");
const status = document.querySelector("#status");

const packageName = "com.aistudio.happychildren.hckids";

const receiver =
  packageName +
  "/com.example.permissions.HappyChildrenDeviceAdminReceiver";

let adb = null;
let usbConnection = null;
let busy = false;

function show(message) {
  status.textContent = message;
}

async function shell(command) {
  if (!adb) throw new Error("ADB 연결이 없습니다.");

  const service = adb.subprocess.shellProtocol;

  if (!service) {
    throw new Error("ADB 셸 기능을 사용할 수 없습니다.");
  }

  return await service.spawnWaitText(command);
}

async function checkStatus() {
  register.hidden = true;

  show("기기 관리자 등록 상태 확인 중...");

  const result = await shell("dpm list-owners");

  if (result.exitCode !== 0) {
    throw new Error(
      "관리자 상태 확인 실패: " + result.stderr.trim()
    );
  }

  const owners = result.stdout.trim();

  const owner = owners
    .split(/\r?\n/)
    .find(line => /\bDevice\s*Owner\b/i.test(line));

  if (
    owner &&
    owner.includes("admin=" + packageName + "/")
  ) {
    show(
      "Happy Children 기기 관리자가 이미 등록되어 있습니다. " +
      "앱에서 자녀 모드 상태를 확인해 주세요."
    );
    return;
  }

  if (
    owner ||
    !/^(no owners|0 owners?)\.?$/i.test(owners)
  ) {
    show(
      "기존 관리자가 있거나 등록 상태를 판별할 수 없습니다. " +
      owners
    );
    return;
  }

  const installed = await shell("pm path " + packageName);

  if (
    installed.exitCode !== 0 ||
    !/^package:/m.test(installed.stdout)
  ) {
    show(
      "Happy Children 앱이 설치되어 있지 않습니다. " +
      "먼저 APK를 설치해 주세요."
    );
    return;
  }

  show(
    "Happy Children 앱 설치 확인 완료. " +
    "이탈 방지 설정을 진행할 수 있습니다."
  );

  register.hidden = false;
}

connect.addEventListener("click", async () => {

  if (busy) return;

  busy = true;
  connect.disabled = true;
  register.hidden = true;

  try {

    show("ADB 연결 모듈을 불러오는 중입니다...");

    if (!navigator.usb) {
      throw new Error(
        "Chrome 또는 Edge PC 브라우저에서 HTTPS로 접속해 주세요."
      );
    }

    const [
      { Adb, AdbDaemonTransport },
      { AdbDaemonWebUsbDeviceManager },
      credentials
    ] = await Promise.all([

      import("https://esm.sh/@yume-chan/adb@2.0.0"),

      import("https://esm.sh/@yume-chan/adb-daemon-webusb@2.0.0"),

      import("https://esm.sh/@yume-chan/adb-credential-web@2.0.0")

    ]);

    const manager = AdbDaemonWebUsbDeviceManager.BROWSER;

    if (!manager) {
      throw new Error("WebUSB를 지원하는 Chrome 또는 Edge가 필요합니다.");
    }

    show("갤럭시 USB 기기를 선택해 주세요.");

    const permitted = await manager.getDevices();

    const device = permitted.length === 1
      ? permitted[0]
      : await manager.requestDevice();

    if (!device) {
      show("갤럭시 기기를 선택하지 않았습니다.");
      return;
    }

    if (adb) {
      await adb.close();
      adb = null;
    }

    if (usbConnection) {
      try {
        await usbConnection.readable.cancel();
      } catch {}
      usbConnection = null;
    }

    show(
      "갤럭시 USB 연결 중입니다. " +
      "휴대폰 화면을 확인해 주세요."
    );

    usbConnection = await device.connect();

    show(
      "ADB 인증 요청 중입니다. " +
      "휴대폰에 USB 디버깅 허용 창이 나타나면 허용해 주세요."
    );

    const credentialStore = new credentials.default();

    const transport = await AdbDaemonTransport.authenticate({
      serial: device.serial,
      connection: usbConnection,
      credentialStore
    });

    adb = new Adb(transport);

    show("ADB 인증 성공. 기기 정보를 확인합니다.");

    await checkStatus();

  } catch (error) {

    register.hidden = true;

    show(
      "연결 또는 상태 확인 실패: " +
      (error.message || String(error))
    );

    if (adb) {
      try {
        await adb.close();
      } catch {}
      adb = null;
    }

    if (usbConnection) {
      try {
        await usbConnection.readable.cancel();
      } catch {}
      usbConnection = null;
    }

  } finally {

    connect.disabled = false;
    busy = false;

  }

});

register.addEventListener("click", async () => {

  if (busy || !adb) return;

  const confirmed = window.confirm(
    "연결된 갤럭시를 Happy Children의 기기 관리 대상으로 등록할까요?\n\n" +
    "Device Owner 등록은 강력한 기기 관리 권한을 부여합니다."
  );

  if (!confirmed) return;

  busy = true;
  connect.disabled = true;
  register.disabled = true;

  try {

    await checkStatus();

    if (register.hidden) return;

    show("기기 관리자 등록 명령 실행 중...");

    const result = await shell(
      "dpm set-device-owner " + receiver
    );

    show("등록 명령 실행 완료. 실제 등록 상태를 재확인합니다.");

    await checkStatus();

    if (!register.hidden) {

      show(
        "등록되지 않았습니다.\n" +
        (result.stderr.trim() ||
         result.stdout.trim() ||
         "안드로이드 등록 조건과 앱의 관리자 Receiver를 확인해 주세요.")
      );

    }

  } catch (error) {

    register.hidden = true;

    show(
      "등록 결과 확인 실패: " +
      (error.message || String(error))
    );

  } finally {

    connect.disabled = false;
    register.disabled = false;
    busy = false;

  }

});

</script>

</body>
</html>
